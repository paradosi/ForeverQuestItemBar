<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Forever Quest Item Bar logo: the quest "!" on a scroll, inside an action-button slot.
       Source for media/art/logo_400.png, logo_64.png and media/textures/logo_64.tga. -->
  <defs>
    <radialGradient id="slot" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#34508a"/>
      <stop offset="0.6" stop-color="#16213f"/>
      <stop offset="1" stop-color="#070b17"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.3" stop-color="#e8c25a"/>
      <stop offset="0.65" stop-color="#a8751f"/>
      <stop offset="1" stop-color="#5c3c0c"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="0.5" stop-color="#b88a2c"/>
      <stop offset="1" stop-color="#4a300a"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a46a"/>
      <stop offset="0.25" stop-color="#f4e4bc"/>
      <stop offset="0.75" stop-color="#efd9a6"/>
      <stop offset="1" stop-color="#b88f55"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7c2"/>
      <stop offset="0.5" stop-color="#d8b67a"/>
      <stop offset="1" stop-color="#8f6a35"/>
    </linearGradient>
    <linearGradient id="bang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset="0.45" stop-color="#ffd21f"/>
      <stop offset="1" stop-color="#e88a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe14d" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#ffb400" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Slot: gold outer rim, dark inner bevel, deep blue well -->
  <rect x="14" y="14" width="372" height="372" rx="46" fill="url(#gold)"/>
  <rect x="30" y="30" width="340" height="340" rx="34" fill="url(#goldInner)"/>
  <rect x="40" y="40" width="320" height="320" rx="26" fill="url(#slot)"/>
  <!-- top sheen -->
  <path d="M40 66 Q40 40 66 40 L334 40 Q360 40 360 66 L360 120 Q200 92 40 132 Z" fill="#ffffff" opacity="0.07"/>

  <!-- Quest glow -->
  <circle cx="200" cy="200" r="150" fill="url(#glow)"/>

  <!-- Scroll -->
  <g filter="url(#shadow)">
    <rect x="112" y="92" width="176" height="216" fill="url(#parchment)"/>
    <!-- faint writing lines either side of the mark -->
    <g stroke="#8f6a35" stroke-width="5" stroke-linecap="round" opacity="0.35">
      <line x1="130" y1="140" x2="166" y2="140"/>
      <line x1="234" y1="140" x2="270" y2="140"/>
      <line x1="130" y1="170" x2="160" y2="170"/>
      <line x1="240" y1="170" x2="270" y2="170"/>
      <line x1="130" y1="200" x2="166" y2="200"/>
      <line x1="234" y1="200" x2="270" y2="200"/>
      <line x1="130" y1="230" x2="158" y2="230"/>
      <line x1="242" y1="230" x2="270" y2="230"/>
    </g>
    <!-- rolls -->
    <rect x="96" y="76" width="208" height="30" rx="15" fill="url(#roll)" stroke="#5c3c0c" stroke-width="4"/>
    <rect x="96" y="294" width="208" height="30" rx="15" fill="url(#roll)" stroke="#5c3c0c" stroke-width="4"/>
    <circle cx="96" cy="91" r="9" fill="#7a2a12" stroke="#3a1206" stroke-width="3"/>
    <circle cx="304" cy="91" r="9" fill="#7a2a12" stroke="#3a1206" stroke-width="3"/>
    <circle cx="96" cy="309" r="9" fill="#7a2a12" stroke="#3a1206" stroke-width="3"/>
    <circle cx="304" cy="309" r="9" fill="#7a2a12" stroke="#3a1206" stroke-width="3"/>
  </g>

  <!-- The quest "!" -->
  <g filter="url(#shadow)" stroke="#3a2000" stroke-width="10" stroke-linejoin="round">
    <path d="M172 112 L228 112 L216 236 L184 236 Z" fill="url(#bang)"/>
    <circle cx="200" cy="270" r="22" fill="url(#bang)"/>
  </g>
  <!-- highlight on the mark -->
  <path d="M182 122 L196 122 L190 212 L186 212 Z" fill="#ffffff" opacity="0.45"/>
</svg>
