name: Package and release

on:
  push:
    tags:
      - '**'

# Creating the GitHub release needs a write token. Repos made after GitHub's
# 2023 change default GITHUB_TOKEN to read-only, so ask for it explicitly
# (v1.0.0's release step failed with 403 without this).
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
